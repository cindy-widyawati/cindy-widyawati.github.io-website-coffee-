<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: #5E4632;
            /* Coklat kopi */
            font-family: 'Poppins', sans-serif;
        }

        .order-card {
            background: #f7e9d4;
            /* Cream latte */
            border-radius: 18px;
            border: none;
            padding: 30px;
        }

        .title {
            color: #4e3826;
            font-weight: 700;
        }

        #detailPesanan {
            background: #d7b894;
            padding: 18px;
            border-radius: 12px;
            color: #3a2a20;
        }

        .btn-coffee {
            background: #c48a4a;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-coffee:hover {
            background: #a26f36;
            color: white;
            transform: scale(1.03);
        }

        label {
            font-weight: 600;
            color: #3c2d23;
        }

        input,
        textarea {
            background: #fff;
            border: 1px solid #c7b299;
            border-radius: 10px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #8a6a52;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            margin-bottom: 15px;
            display: inline-block;
        }

        .back-btn:hover {
            background: #725843;
            color: #fff;
        }


        /* ======== PESAN BERHASIL TANPA JS ======== */
        #pesanBerhasil {
            display: none;
            margin-top: 15px;
            background: #63b35a;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
        }

        #sukses:checked+#formPemesanan #pesanBerhasil {
            display: block;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <a href="2.html" class="back-btn">← Kembali ke Menu</a>

        <div class="order-card shadow mx-auto" style="max-width: 580px;">

            <h2 class="text-center title mb-4">Form Pemesanan</h2>

            <div id="detailPesanan" class="mb-4"></div>

            <!-- Checkbox tersembunyi -->
            <input type="checkbox" id="sukses" hidden>

            <!-- FORM PEMESANAN -->
            <form id="formPemesanan">
                <div class="mb-3">
                    <label>Nama Pemesan</label>
                    <input type="text" class="form-control" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="mb-3">
                    <label>Alamat</label>
                    <textarea class="form-control" placeholder="Masukkan alamat lengkap" rows="2"
                        required></textarea>
                </div>

                <div class="mb-3">
                    <label>Nomor WhatsApp</label>
                    <input type="text" class="form-control" placeholder="08xxxxxxxxxx" required>
                </div>

                <!-- Tombol Diganti Label -->
                <label for="sukses" class="btn btn-coffee w-100 py-2 mt-2">
                    Kirim Pesanan
                </label>

                <!-- Pesan Berhasil -->
                <div id="pesanBerhasil">✔ Pesanan Berhasil Dikirim!</div>
            </form>
        </div>
    </div>

</body>
</html>
